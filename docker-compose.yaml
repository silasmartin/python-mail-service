services:
  # The bind mount below shadows the image's data directory, so its ownership
  # comes from the host and rarely matches the container's uid. Fix it up before
  # the app starts, otherwise SQLite fails with "unable to open database file".
  init_data:
    image: busybox
    user: root
    command: chown -R 10001:10001 /data
    volumes:
      - ./data:/data

  flask_app:
    build: .
    image: pythonmailservice
    container_name: pythonmailservice
    restart: unless-stopped
    depends_on:
      init_data:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      - '127.0.0.1:8004:8004'
    volumes:
      - ./data:/usr/src/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=3).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
